<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Inter+Tight:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:radial-gradient(900px 520px at 90% 115%,#5a8bff 0%,transparent 60%),linear-gradient(135deg,#1f5eff 0%,#1747c9 100%);color:#fff;position:relative;font-family:"Inter Tight",Arial,sans-serif}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at 30% 40%,#000 30%,transparent 80%)}
  .logo{position:absolute;left:80px;top:96px;display:flex;align-items:baseline;gap:22px}
  .logo b{font:900 230px/.8 "Big Shoulders Display",Impact,sans-serif;letter-spacing:.01em}
  .logo span{font:500 34px/1 "JetBrains Mono",monospace;letter-spacing:.32em;opacity:.85}
  .line{position:absolute;left:84px;top:330px;font:900 64px/1 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase}
  .sub{position:absolute;left:86px;top:410px;font:600 25px/1.3 "Inter Tight",Arial,sans-serif;opacity:.92;max-width:600px}
  .chips{position:absolute;left:80px;bottom:46px;display:flex;gap:10px}
  .chips span{font:600 15px/1 "Inter Tight",Arial,sans-serif;padding:11px 16px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
  .truck{position:absolute;right:-90px;bottom:-30px;width:640px;filter:drop-shadow(0 14px 22px rgba(0,0,0,.3))}
</style></head>
<body>
  <div class="grid"></div>
  <div class="logo"><b>M.I.E.</b><span>LOGISTICS</span></div>
  <div class="line">Your vehicle. Our priority.</div>
  <div class="sub">Door-to-door car carrier transport across South Africa since 2007.</div>
  <div class="chips"><span>24/7 satellite tracking</span><span>Full GIT cover</span><span>073 697 7731</span></div>
  <img class="truck" src="../../assets/img/truck-side.png" alt="">
</body></html>
