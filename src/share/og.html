<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:radial-gradient(900px 500px at 85% 110%,#4d82ff 0%,transparent 60%),linear-gradient(135deg,#1f5eff 0%,#1747c9 100%);font-family:"Inter Tight",Arial,sans-serif;color:#fff;position:relative}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
  .card{position:absolute;left:50%;top:205px;transform:translate(-50%,-50%);background:#fff;border-radius:28px;padding:38px 56px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
  .card img{display:block;width:640px;height:auto}
  .line{position:absolute;left:0;right:0;top:372px;text-align:center;font:900 64px/1 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em}
  .sub{position:absolute;left:0;right:0;top:450px;text-align:center;font:600 24px/1 "Inter Tight",Arial,sans-serif;opacity:.9;letter-spacing:.02em}
  .truck{position:absolute;right:-60px;bottom:-34px;width:520px;opacity:.95;filter:drop-shadow(0 10px 18px rgba(0,0,0,.3))}
  .chips{position:absolute;left:60px;bottom:44px;display:flex;gap:10px}
  .chips span{font:600 15px/1 "Inter Tight",Arial,sans-serif;padding:11px 16px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
</style></head>
<body>
  <div class="grid"></div>
  <div class="card"><img src="../../assets/img/logo.png" alt=""></div>
  <div class="line">Your vehicle. Our priority.</div>
  <div class="sub">Door-to-door car carrier transport across South Africa · Since 2007</div>
  <div class="chips"><span>24/7 satellite tracking</span><span>Full GIT cover</span><span>073 697 7731</span></div>
  <img class="truck" src="../../assets/img/truck-side.png" alt="">
</body></html>
